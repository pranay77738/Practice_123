<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
</head>
<body>
<h1>Welcome to the Meeting Planner!</h1>
<p>
    This is django application for the course
    <em>Dango: Getting started</em>
    on <a href="https://www.pluralsight.com">Pluralsight</a>
</p>
<h2>Meetings</h2>
<ul>
    {% for meeting in meetings %}
    <li>
        <a href="{% url 'details' meeting.id %}">{{meeting.Title}}</a>
    </li>
    {% endfor %}
</ul>
<a href="{% url 'rooms' %}">Room List</a>
</body>
</html>
